name: CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:

jobs:

  backend:
    name: Backend - Build & Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AtlanticCity.MassiveLoad.sln

      - name: Build
        run: >
          dotnet build
          AtlanticCity.MassiveLoad.sln
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          AtlanticCity.MassiveLoad.sln
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"


  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build


  docker:
    name: Docker - Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build